<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Ingestion | Nyaya Vedika Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #222;
            --text: #fff;
            --muted: #888;
            --accent: #3b82f6;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        h1 span {
            color: var(--accent);
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--text);
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .upload-zone input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            color: var(--muted);
        }

        .upload-text strong {
            color: var(--accent);
        }

        .file-list {
            margin-bottom: 24px;
        }

        .file-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .file-name {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-size {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--error);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .file-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field label {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .field input,
        .field select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 0.9rem;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-bar .fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        .file-item.processing .progress-bar {
            display: block;
        }

        .file-item.done {
            border-color: var(--success);
        }

        .file-item.error {
            border-color: var(--error);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .status-badge.pending {
            background: var(--border);
            color: var(--muted);
        }

        .status-badge.processing {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent);
        }

        .status-badge.done {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .status-badge.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        .stats {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--card);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .log {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            display: none;
        }

        .log.visible {
            display: block;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .log-entry.error {
            color: var(--error);
        }

        .log-entry.success {
            color: var(--success);
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>📄 Document <span>Ingestion</span></h1>
            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalFiles">0</div>
                <div class="stat-label">Files Selected</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="processedFiles">0</div>
                <div class="stat-label">Processed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalChunks">0</div>
                <div class="stat-label">Chunks Created</div>
            </div>
        </div>

        <div class="upload-zone" id="dropZone">
            <div class="upload-icon">📁</div>
            <div class="upload-text">
                <strong>Click to upload</strong> or drag and drop<br>
                PDF, TXT files (max 10MB each)
            </div>
            <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md">
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
            <button class="btn btn-primary" id="ingestBtn" onclick="startIngestion()" disabled>
                Start Ingestion
            </button>
        </div>

        <div class="log" id="logPanel"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eosrmuihgcinncaytxae.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc3JtdWloZ2Npbm5jYXl0eGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYzMTQ0MjgsImV4cCI6MjA1MTg5MDQyOH0.VqMCwgp6Jx8S9R9R-znIftNjUrtYA9R61jjgpZ0dYlU';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let files = [];
        let session = null;

        // Check auth
        async function checkAuth() {
            const { data } = await supabaseClient.auth.getSession();
            if (!data.session) {
                window.location.href = 'login.html?redirect=admin-ingest';
                return;
            }
            session = data.session;

            // Check if admin (simple check - could enhance)
            log('Authenticated as: ' + session.user.email);
        }

        // Drag and drop
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(fileList) {
            for (const file of fileList) {
                if (file.size > 10 * 1024 * 1024) {
                    log(`Skipped ${file.name}: exceeds 10MB`, 'error');
                    continue;
                }

                const ext = file.name.split('.').pop().toLowerCase();
                if (!['pdf', 'txt', 'md'].includes(ext)) {
                    log(`Skipped ${file.name}: unsupported format`, 'error');
                    continue;
                }

                files.push({
                    file: file,
                    name: file.name,
                    size: file.size,
                    title: file.name.replace(/\.[^.]+$/, '').replace(/_/g, ' '),
                    source: 'upload',
                    docType: guessDocType(file.name),
                    court: '',
                    citation: '',
                    status: 'pending',
                    progress: 0
                });
            }

            renderFiles();
            updateStats();
        }

        function guessDocType(name) {
            const lower = name.toLowerCase();
            if (lower.includes('act') || lower.includes('code')) return 'act';
            if (lower.includes('judgment') || lower.includes('order')) return 'judgment';
            if (lower.includes('circular') || lower.includes('notification')) return 'circular';
            return 'other';
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = files.map((f, i) => `
            <div class="file-item ${f.status}" id="file-${i}">
                <div class="file-header">
                    <div class="file-name">
                        📄 ${f.name}
                        <span class="status-badge ${f.status}">${f.status}</span>
                    </div>
                    <div>
                        <span class="file-size">${formatSize(f.size)}</span>
                        <button class="remove-btn" onclick="removeFile(${i})">×</button>
                    </div>
                </div>
                <div class="file-meta">
                    <div class="field">
                        <label>Title</label>
                        <input type="text" value="${f.title}" onchange="updateFile(${i}, 'title', this.value)">
                    </div>
                    <div class="field">
                        <label>Type</label>
                        <select onchange="updateFile(${i}, 'docType', this.value)">
                            <option value="act" ${f.docType === 'act' ? 'selected' : ''}>Act/Statute</option>
                            <option value="judgment" ${f.docType === 'judgment' ? 'selected' : ''}>Judgment</option>
                            <option value="circular" ${f.docType === 'circular' ? 'selected' : ''}>Circular</option>
                            <option value="other" ${f.docType === 'other' ? 'selected' : ''}>Other</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Source</label>
                        <select onchange="updateFile(${i}, 'source', this.value)">
                            <option value="upload" ${f.source === 'upload' ? 'selected' : ''}>Manual Upload</option>
                            <option value="indiacode" ${f.source === 'indiacode' ? 'selected' : ''}>IndiaCode</option>
                            <option value="sc_judgment" ${f.source === 'sc_judgment' ? 'selected' : ''}>Supreme Court</option>
                            <option value="hc_judgment" ${f.source === 'hc_judgment' ? 'selected' : ''}>High Court</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Citation (optional)</label>
                        <input type="text" value="${f.citation}" placeholder="e.g. AIR 2020 SC 1234" onchange="updateFile(${i}, 'citation', this.value)">
                    </div>
                </div>
                <div class="progress-bar"><div class="fill" style="width: ${f.progress}%"></div></div>
            </div>
        `).join('');

            document.getElementById('ingestBtn').disabled = files.length === 0;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function updateFile(index, field, value) {
            files[index][field] = value;
        }

        function removeFile(index) {
            files.splice(index, 1);
            renderFiles();
            updateStats();
        }

        function clearAll() {
            files = [];
            renderFiles();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalFiles').textContent = files.length;
            document.getElementById('processedFiles').textContent = files.filter(f => f.status === 'done').length;
        }

        function log(message, type = 'info') {
            const panel = document.getElementById('logPanel');
            panel.classList.add('visible');
            panel.innerHTML += `<div class="log-entry ${type}">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            panel.scrollTop = panel.scrollHeight;
        }

        async function startIngestion() {
            const btn = document.getElementById('ingestBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            let totalChunks = 0;

            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                if (f.status === 'done') continue;

                f.status = 'processing';
                renderFiles();
                log(`Processing: ${f.name}`);

                try {
                    // Read file content
                    const text = await readFileContent(f.file);

                    if (!text || text.length < 100) {
                        throw new Error('Could not extract sufficient text');
                    }

                    f.progress = 30;
                    renderFiles();
                    log(`Extracted ${text.length} characters`);

                    // Send to backend for processing
                    const response = await fetch('api/ingest.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + session.access_token
                        },
                        body: JSON.stringify({
                            title: f.title,
                            source: f.source,
                            doc_type: f.docType,
                            citation: f.citation,
                            content: text
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        f.status = 'done';
                        f.progress = 100;
                        totalChunks += result.chunks || 0;
                        log(`✓ ${f.name}: ${result.chunks} chunks created`, 'success');
                    } else {
                        throw new Error(result.error || 'Unknown error');
                    }

                } catch (err) {
                    f.status = 'error';
                    log(`✗ ${f.name}: ${err.message}`, 'error');
                }

                renderFiles();
                updateStats();
                document.getElementById('totalChunks').textContent = totalChunks;
            }

            btn.textContent = 'Start Ingestion';
            btn.disabled = files.filter(f => f.status === 'pending').length === 0;
            log('Ingestion complete!', 'success');
        }

        async function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;

                    // For text files, return directly
                    if (file.type === 'text/plain' || file.name.endsWith('.txt') || file.name.endsWith('.md')) {
                        resolve(content);
                        return;
                    }

                    // For PDF, we'll send to backend for extraction
                    // For now, just return the text (backend will handle PDF)
                    resolve(content);
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        // Init
        checkAuth();
    </script>

</body>

</html>
