<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Nyaya Vedika</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --sidebar-bg: #111111;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #222222;
            --user-bubble: #3b82f6;
            --ai-bubble: #1a1a1a;
            --error: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent);
        }

        .new-chat-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--accent-hover);
        }

        .section-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .case-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .case-item {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .case-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .case-item.active {
            background: var(--accent);
            color: white;
        }

        .user-section {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-email {
            font-size: 0.85rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--error);
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Welcome State */
        .welcome-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-state h1 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .welcome-state h1 span {
            color: var(--accent);
        }

        .welcome-state p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 500px;
        }

        .suggestions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .suggestion-chip {
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Message Bubbles */
        .message {
            max-width: 70%;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .message.user .message-content {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        /* Markdown in AI responses */
        .message.assistant .message-content h1,
        .message.assistant .message-content h2,
        .message.assistant .message-content h3 {
            color: var(--accent);
            margin: 16px 0 8px;
        }

        .message.assistant .message-content h1:first-child,
        .message.assistant .message-content h2:first-child,
        .message.assistant .message-content h3:first-child {
            margin-top: 0;
        }

        .message.assistant .message-content ul,
        .message.assistant .message-content ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .message.assistant .message-content code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .message.assistant .message-content pre {
            background: #0d0d0d;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message.assistant .message-content pre code {
            background: none;
            padding: 0;
        }

        .message.assistant .message-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 16px;
            margin: 12px 0;
            color: var(--text-secondary);
        }

        .message.assistant .message-content strong {
            color: var(--accent);
        }

        .message.assistant .message-content p {
            margin: 8px 0;
        }

        /* Loading Indicator */
        .loading-indicator {
            display: flex;
            gap: 6px;
            padding: 14px 18px;
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            margin-bottom: 16px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            min-height: 52px;
            max-height: 150px;
            font-family: inherit;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .upload-btn,
        .send-btn {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .upload-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            position: relative;
            overflow: hidden;
        }

        .upload-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .upload-btn input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .send-btn {
            background: var(--accent);
            color: white;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            background: #333;
            cursor: not-allowed;
        }

        .upload-btn svg,
        .send-btn svg {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            align-self: center;
            max-width: 90%;
            text-align: center;
        }

        /* Mobile */
        .mobile-header {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .mobile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
            }

            .message {
                max-width: 90%;
            }
        }

        /* Rate limit warning */
        .rate-limit-warning {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <nav class="sidebar">
        <div class="logo">⚖️ Nyaya <span>Vedika</span></div>
        <button class="new-chat-btn" id="newChatBtn">+ New Case</button>

        <div class="section-label">Recent Cases</div>
        <ul class="case-list" id="caseList">
            <li class="case-item" style="color:#666;">Loading cases...</li>
        </ul>

        <div class="user-section">
            <span class="user-email" id="userEmail">Loading...</span>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="mobile-header">
            <span style="font-weight:600;">⚖️ Nyaya Vedika</span>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="welcome-state" id="welcomeState">
                <h1>Welcome to <span>Nyaya Vedika</span></h1>
                <p>Your AI-powered legal research assistant. Ask questions, draft documents, or analyze cases.</p>
                <div class="suggestions">
                    <div class="suggestion-chip"
                        data-query="Draft a bail petition for a client accused under Section 420 IPC">📝 Draft Bail
                        Petition</div>
                    <div class="suggestion-chip"
                        data-query="Find relevant case law on anticipatory bail in cheque bounce cases">🔍 Search Case
                        Law</div>
                    <div class="suggestion-chip" data-query="What is the procedure for filing a consumer complaint?">⚖️
                        Legal Procedure</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea class="chat-input" id="chatInput"
                    placeholder="Ask a legal query, draft a notice, or research case law..." rows="1"></textarea>
                <button class="upload-btn" id="uploadBtn" title="Upload PDF">
                    <input type="file" id="pdfInput" accept="application/pdf">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="send-btn" id="sendBtn" title="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://eosrmuihgcinncaytxae.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fkDI6Nc7vWiHF-uXY5ctIg_r17nfEwB';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State
        let chatHistory = [];
        let isLoading = false;
        let currentCaseId = null;
        let cases = [];
        let accessToken = null;
        let currentUser = null;

        // DOM Elements
        const messagesArea = document.getElementById('messagesArea');
        const welcomeState = document.getElementById('welcomeState');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const userEmailEl = document.getElementById('userEmail');

        // Configure marked.js
        marked.setOptions({ breaks: true, gfm: true });

        // Check authentication on load
        (async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            accessToken = session.access_token;
            currentUser = session.user;
            userEmailEl.textContent = currentUser.email;

            // Load cases
            loadCases();
        })();

        // Listen for auth changes
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                window.location.href = 'login.html';
            } else {
                accessToken = session.access_token;
            }
        });

        // Logout handler
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // API call helper with auth
        async function apiCall(endpoint, options = {}) {
            const response = await fetch(endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`,
                    ...options.headers
                }
            });

            const data = await response.json();

            if (response.status === 401) {
                // Token expired, redirect to login
                window.location.href = 'login.html';
                return null;
            }

            if (response.status === 429) {
                showRateLimitWarning();
                return null;
            }

            return data;
        }

        // Show rate limit warning
        function showRateLimitWarning() {
            const warning = document.createElement('div');
            warning.className = 'rate-limit-warning';
            warning.textContent = 'Rate limit reached. Please wait a moment before trying again.';
            messagesArea.appendChild(warning);
            setTimeout(() => warning.remove(), 5000);
        }

        // Auto-resize textarea
        chatInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Send on Enter
        chatInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        newChatBtn.addEventListener('click', createNewCase);

        // Suggestion chips
        document.querySelectorAll('.suggestion-chip').forEach(chip => {
            chip.addEventListener('click', function () {
                chatInput.value = this.getAttribute('data-query');
                sendMessage();
            });
        });

        // Create new case
        async function createNewCase() {
            const data = await apiCall('api/case_create.php', {
                method: 'POST',
                body: JSON.stringify({ title: 'New Case' })
            });

            if (data?.success) {
                currentCaseId = data.case_id;
                chatHistory = [];
                clearMessages();
                welcomeState.style.display = 'flex';
                loadCases();
            }
        }

        // Load cases
        async function loadCases() {
            const data = await apiCall('api/case_list.php');

            if (data?.success) {
                cases = data.cases;
                renderCaseList();
            }
        }

        // Render case list
        function renderCaseList() {
            const caseList = document.getElementById('caseList');

            if (cases.length === 0) {
                caseList.innerHTML = '<li class="case-item" style="color:#666;">No cases yet</li>';
                return;
            }

            caseList.innerHTML = cases.map(c => `
                <li class="case-item ${c.id == currentCaseId ? 'active' : ''}" 
                    onclick="loadCase(${c.id})">
                    ${escapeHtml(c.title)}
                </li>
            `).join('');
        }

        // Load specific case
        async function loadCase(caseId) {
            const data = await apiCall(`api/case_messages.php?case_id=${caseId}`);

            if (data?.success) {
                currentCaseId = caseId;
                chatHistory = [];
                clearMessages();

                if (data.messages.length === 0) {
                    welcomeState.style.display = 'flex';
                } else {
                    welcomeState.style.display = 'none';
                    data.messages.forEach(msg => {
                        const role = msg.role === 'ai' ? 'assistant' : 'user';
                        addMessageToUI(role, msg.content);
                        chatHistory.push({ role, content: msg.content });
                    });
                }

                renderCaseList();
            }
        }

        // Clear messages
        function clearMessages() {
            const msgs = messagesArea.querySelectorAll('.message, .loading-indicator, .error-message, .rate-limit-warning');
            msgs.forEach(m => m.remove());
        }

        // Send message
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || isLoading) return;

            welcomeState.style.display = 'none';
            addMessageToUI('user', message);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            chatHistory.push({ role: 'user', content: message });

            isLoading = true;
            sendBtn.disabled = true;
            const loadingEl = showLoading();

            try {
                // Create case if none exists
                if (!currentCaseId) {
                    const caseData = await apiCall('api/case_create.php', {
                        method: 'POST',
                        body: JSON.stringify({ title: 'New Case' })
                    });
                    if (caseData?.success) {
                        currentCaseId = caseData.case_id;
                    }
                }

                const data = await apiCall('chat_handler.php', {
                    method: 'POST',
                    body: JSON.stringify({
                        message: message,
                        case_id: currentCaseId,
                        history: chatHistory.slice(0, -1)
                    })
                });

                loadingEl.remove();

                if (data?.success) {
                    addMessageToUI('assistant', data.message);
                    chatHistory.push({ role: 'assistant', content: data.message });
                    loadCases();
                } else if (data) {
                    showError(data.error || 'Failed to get response.');
                }

            } catch (error) {
                loadingEl.remove();
                showError('Network error. Please try again.');
                console.error('Chat error:', error);
            }

            isLoading = false;
            sendBtn.disabled = false;
            chatInput.focus();
        }

        // Add message to UI
        function addMessageToUI(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (role === 'assistant') {
                contentDiv.innerHTML = marked.parse(content);
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Show loading
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading-indicator';
            loadingDiv.innerHTML = `
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            `;
            messagesArea.appendChild(loadingDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
            return loadingDiv;
        }

        // Show error
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            messagesArea.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // PDF Upload handler
        document.getElementById('pdfInput').addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('pdf', file);

            try {
                const response = await fetch('api/upload_pdf.php', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    chatInput.value = `I uploaded a PDF document: "${file.name}". Please summarize it for me.`;
                    chatInput.focus();
                } else {
                    showError(data.error || 'Failed to upload PDF');
                }
            } catch (error) {
                showError('Failed to upload PDF');
            }

            e.target.value = '';
        });
    </script>

</body>

</html>
