<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Faster | AI Website Builder</title>
  
  <!-- Required Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap');

    .font-instrument-sans {
      font-family: 'Instrument Sans', sans-serif;
    }
    .font-instrument-serif {
      font-family: 'Instrument Serif', Georgia, serif;
    }

    /* Motion Keyframes to match motion specifications */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 0.7;
      }
    }

    .animate-pre-headline {
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-main-headline {
      opacity: 0;
      animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .animate-subheadline {
      opacity: 0;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    .animate-buttons {
      opacity: 0;
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }
  </style>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HLS.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#000000] text-white overflow-x-hidden m-0 p-0">

  <!-- Fixed Transparent Navbar -->
  <nav class="fixed top-0 left-0 right-0 w-full z-50 bg-transparent px-6 py-4 flex items-center justify-between">
    <!-- Left Section: Sunburst Icon (24x24px white SVG) -->
    <div class="flex items-center">
      <a href="#" aria-label="Home" class="text-white hover:opacity-90 transition-opacity">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white">
          <path d="M12 2V4.5M12 19.5V22M2 12H4.5M19.5 12H22M4.93 4.93L6.7 6.7M17.3 17.3L19.07 19.07M4.93 19.07L6.7 17.3M17.3 6.7L19.07 4.93M12 7C9.24 7 7 9.24 7 12C7 14.76 9.24 17 12 17C14.76 17 17 14.76 17 12C17 9.24 14.76 7 12 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <!-- Center Section: Navigation Links (hidden on mobile, visible md:flex) -->
    <div class="hidden md:flex items-center gap-8 font-instrument-sans text-sm font-medium">
      <div class="relative group cursor-pointer flex items-center gap-1 text-white/80 hover:text-white transition-colors">
        <span>Products</span>
        <i data-lucide="chevron-down" class="w-4 h-4 transition-transform group-hover:rotate-180"></i>
      </div>
      <a href="#customer-stories" class="text-white/80 hover:text-white transition-colors">Customer Stories</a>
      <a href="#resources" class="text-white/80 hover:text-white transition-colors">Resources</a>
      <a href="#pricing" class="text-white/80 hover:text-white transition-colors">Pricing</a>
    </div>

    <!-- Right Section: Action Links & Button -->
    <div class="flex items-center gap-6 font-instrument-sans">
      <a href="#demo" class="hidden sm:block text-sm font-medium text-white/80 hover:text-white transition-colors">Book A Demo</a>
      <button type="button" class="bg-white text-black rounded-full px-5 py-2.5 font-semibold text-sm hover:bg-white/90 transition-all hover:scale-105 active:scale-95">
        Get Started
      </button>
    </div>
  </nav>

  <!-- Hero Section Container -->
  <section class="relative w-full min-h-screen bg-[#000000] text-white overflow-hidden flex flex-col justify-center items-center pt-24 pb-16">

    <!-- Background Video Layer -->
    <video
      id="heroVideo"
      poster="https://images.unsplash.com/photo-1647356191320-d7a1f80ca777?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxhYnN0cmFjdCUyMGRhcmslMjB0ZWNobm9sb2d5JTIwbmV1cmFsJTIwbmV0d29ya3xlbnwxfHx8fDE3Njg5NzIyNTV8MA&ixlib=rb-4.1.0&q=80&w=1080"
      muted
      loop
      playsinline
      autoplay
      class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none -z-20"
    ></video>

    <!-- Video Overlay: bg-black/60 with backdrop-blur-[2px] -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-[2px] pointer-events-none -z-10"></div>

    <!-- Decorative Gradients -->
    <!-- Top-left gradient: top-[-20%] left-[20%], 600x600px, bg-blue-900/20, blur-[120px], mix-blend-screen -->
    <div class="absolute top-[-20%] left-[20%] w-[600px] h-[600px] bg-blue-900/20 rounded-full blur-[120px] mix-blend-screen pointer-events-none -z-10"></div>
    <!-- Bottom-right gradient: bottom-[-10%] right-[20%], 500x500px, bg-indigo-900/20, blur-[120px], mix-blend-screen -->
    <div class="absolute bottom-[-10%] right-[20%] w-[500px] h-[500px] bg-indigo-900/20 rounded-full blur-[120px] mix-blend-screen pointer-events-none -z-10"></div>

    <!-- Content Container -->
    <div class="relative z-10 max-w-5xl mx-auto px-6 flex flex-col items-center text-center mt-20 space-y-12">

      <!-- Pre-headline -->
      <p class="font-instrument-serif text-3xl sm:text-5xl lg:text-[48px] leading-[1.1] text-white animate-pre-headline m-0">
        Design at the speed of thought
      </p>

      <!-- Main Headline -->
      <h1 class="font-instrument-sans font-semibold text-6xl sm:text-8xl lg:text-[136px] leading-[0.9] tracking-tighter bg-gradient-to-b from-white via-white to-[#b4c0ff] bg-clip-text text-transparent animate-main-headline m-0">
        Build Faster
      </h1>

      <!-- Subheadline -->
      <p class="font-instrument-sans text-lg sm:text-[20px] leading-[1.65] text-white max-w-xl mx-auto animate-subheadline m-0">
        Create fully functional, SEO-optimized websites in seconds with our advanced AI engine.
      </p>

      <!-- CTA Buttons -->
      <div class="flex flex-col sm:flex-row gap-6 items-center justify-center pt-2 animate-buttons">
        <!-- Primary Button -->
        <button type="button" class="flex items-center pl-6 pr-2 py-2 rounded-full bg-white transition-all duration-300 hover:shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:scale-105 active:scale-95 group cursor-pointer border-0">
          <span class="font-instrument-sans font-medium text-lg text-[#0a0400]">Start Building Free</span>
          <div class="w-10 h-10 rounded-full bg-[#3054ff] group-hover:bg-[#2040e0] flex items-center justify-center transition-colors ml-4">
            <i data-lucide="arrow-right" class="w-5 h-5 text-white"></i>
          </div>
        </button>

        <!-- Secondary Button -->
        <a href="#examples" class="flex items-center px-4 py-2 rounded-lg text-white/70 hover:text-white backdrop-blur-sm hover:bg-white/5 transition-all group font-instrument-sans text-base no-underline">
          <span>See Examples</span>
          <i data-lucide="arrow-right" class="w-4 h-4 ml-2 transition-transform duration-200 group-hover:translate-x-1"></i>
        </a>
      </div>

    </div>

  </section>

  <!-- HLS.js Video Streaming Script -->
  <script>
    const video = document.getElementById('heroVideo');
    const videoSrc = "https://stream.mux.com/T6oQJQ02cQ6N01TR6iHwZkKFkbepS34dkkIc9iukgy400g.m3u8";

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(function (e) {
          console.log("Auto-play prevented:", e);
        });
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = videoSrc;
      video.addEventListener("loadedmetadata", function () {
        video.play().catch(function (e) {
          console.log("Auto-play prevented:", e);
        });
      });
    }

    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
